<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Search — Aetherbound</title>
<meta name="description" content="Search only Aetherbound-legal Magic cards using Scryfall search syntax.">
<meta name="theme-color" content="#0b0d17">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main>
<section class="page-head">
  <h1>Card Search</h1>
  <p>Searches only Aetherbound-legal cards. Supports full <a href="https://scryfall.com/docs/syntax" rel="noopener">Scryfall syntax</a>, e.g. <code>id:ug t:legendary t:creature</code> or <code>o:"draw a card" cmc&lt;=2</code>.</p>
</section>
<form id="search-form" class="search-bar">
  <input class="input" id="search-input" type="search" placeholder="Search cards…" autocomplete="off">
  <button class="btn primary" type="submit">Search</button>
</form>
<div class="chips" id="chips"></div>
<p class="muted small" id="search-status" style="margin-top:16px"></p>
<div class="card-grid" id="search-results"></div>
<div class="btn-row" style="margin-top:24px"><button class="btn hidden" id="more-btn">Load more</button></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/config.js"></script>
<script src="assets/layout.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/search.js"></script>
</body>
</html>
